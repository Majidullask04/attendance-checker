services:
  # ── Backend API (Node + PostgreSQL) ────────────────────────
  - type: web
    name: mrelectric-attendance-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mrelectric-attendance-db
          property: connectionString
      # Render generates a strong secret once and keeps it stable across deploys.
      - key: JWT_SECRET
        generateValue: true
      # Whoever signs up with THIS email is automatically granted the admin role.
      - key: ADMIN_EMAIL
        value: mrelectricalworks02@gmail.com
      # Allowed browser origin(s) for CORS — comma-separate to allow more than one.
      # After the first deploy, if Render assigns the frontend a different URL,
      # update this to the ACTUAL static-site URL and redeploy the API.
      - key: FRONTEND_URL
        value: https://mrelectric-attendance.onrender.com

  # ── Frontend (Vite static site) ─────────────────────────────────────────────
  - type: web
    name: mrelectric-attendance
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Baked into the build by Vite. Must point at the backend's /api base.
      # Update if the API is assigned a different URL.
      - key: VITE_API_URL
        value: https://mrelectric-attendance-api.onrender.com/api
    routes:
      # SPA fallback: serve index.html for client-side routes / refreshes
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: mrelectric-attendance-db
    databaseName: attendance
    user: attendance_user
    plan: free
